id           = "diasbaskara/faceid"
name         = "Face ID"
version      = "1.4.1"
plugin_api   = 18
author       = "diasbaskara"
license      = "MIT"
icon         = "face-id"
description  = "iOS-style Face ID overlay: an attached panel that loops the looking-for-face animation while Howdy runs a face scan, then closes."
tags         = ["overlay", "indicator", "security", "howdy", "lottie"]
dependencies = ["howdy"]

# The process fragment that identifies a running Howdy scan. The service
# matches it against full command lines (`pgrep -f`). Keep the ".py" so a stray
# `howdy` management command is not mistaken for a scan.
[[setting]]
key             = "process_pattern"
type            = "string"
label_key       = "settings.process_pattern.label"
description_key = "settings.process_pattern.description"
default         = "compare.py"

# Headless owner of the scan state. It opens the panel while Howdy runs and
# closes it when the scan ends.
[[service]]
id    = "watch"
entry = "service.luau"

# Panel attached to the bar (like the control center), not floating/detached.
# Non-interactive: never takes keyboard focus and is not dismissed by clicks.
[[panel]]
id    = "dialog"
entry = "panel.luau"
width = 112
height = 112
placement = "attached"
dismiss_on_outside_click = false
keyboard_focus = "none"
