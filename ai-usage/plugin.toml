id = "diasbaskara/ai-usage"
name = "AI Usage Multi"
version = "1.11.1"
plugin_api = 22
author = "diasbaskara"
license = "MIT"
icon = "brain"
description = "One bar capsule listing several ai-usagebar providers (Claude, Cursor, Grok, OpenCode Go) with a details panel."
tags = ["bar", "panel", "ai", "indicator", "utility"]
# The CLI owns credentials, vendor endpoints and caching. This plugin only runs
# `ai-usagebar usage --json` and draws the result.
dependencies = ["ai-usagebar"]

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 2
min = 1
max = 60

# One poller for the whole shell: a single `usage --json` call returns every
# vendor, so N capsules on M monitors still cost one process per cycle.
[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [widget.actions]
  right = "plugin diasbaskara/ai-usage:poller all refresh"

# Comma-separated provider ids, in display order.
# Valid: anthropic | openai | copilot | cursor | supergrok | grok | grokbot |
# opencode-go | zai | openrouter | deepseek | kimi | and the rest
# `ai-usagebar vendors` knows. A provider that is disabled or missing a
# credential is skipped (its error stays visible in the panel).
[[widget.setting]]
key = "vendors"
type = "string"
label_key = "settings.vendors.label"
description_key = "settings.vendors.description"
default = "anthropic,cursor,supergrok,opencode-go,grokbot"

[[widget.setting]]
key = "show_glyph"
type = "bool"
label_key = "settings.show_glyph.label"
description_key = "settings.show_glyph.description"
default = true

[[widget.setting]]
key = "show_reset"
type = "bool"
label_key = "settings.show_reset.label"
description_key = "settings.show_reset.description"
default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 480
height = 480
placement = "attached"
position = "auto"
open_near_click = true
dismiss_on_outside_click = true
capture_keys = ["escape", "r"]
